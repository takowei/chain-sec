name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Slither, solc-select and test tools
        run: pip install slither-analyzer solc-select pytest ruff==0.15.20
      - name: Install solc 0.8.20 and 0.8.30
        run: |
          solc-select install 0.8.20 0.8.30
          solc-select use 0.8.20
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: python -m pytest -q
